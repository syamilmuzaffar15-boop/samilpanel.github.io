<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pterodactyl - Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0a0a0a; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card-panel { background: #1a0a0a; border: 1px solid #3a1a1a; border-radius: 32px; padding: 40px 30px; max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(255,0,0,0.05); animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo i { font-size: 48px; color: #ff1a1a; background: #1a0505; padding: 18px; border-radius: 60px; border: 2px solid #3a1a1a; }
        .logo h2 { color: #ff4a4a; font-weight: 700; margin-top: 12px; font-size: 22px; letter-spacing: 1px; }
        .logo h2 span { color: #fff; }
        .logo p { color: #6a4a4a; font-size: 13px; margin-top: 4px; }
        .form-control-custom { background: #0a0505; border: 2px solid #2a1a1a; border-radius: 40px; padding: 14px 20px; color: #ff8a8a; font-size: 15px; width: 100%; transition: 0.3s; }
        .form-control-custom:focus { border-color: #ff1a1a; box-shadow: 0 0 0 4px rgba(255,0,0,0.1); outline: none; color: #fff; }
        .form-control-custom::placeholder { color: #4a3a3a; }
        .btn-create { background: linear-gradient(135deg, #cc0000, #ff1a1a); border: none; border-radius: 60px; padding: 16px; font-weight: 700; font-size: 18px; color: #fff; width: 100%; transition: 0.3s; box-shadow: 0 4px 24px rgba(255,0,0,0.3); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }
        .btn-create:hover { transform: scale(1.02); box-shadow: 0 8px 40px rgba(255,0,0,0.5); }
        .btn-create:active { transform: scale(0.96); }
        .btn-create i { margin-right: 10px; }
        .footer-text { text-align: center; color: #4a3a3a; font-size: 13px; margin-top: 24px; border-top: 1px solid #1a0a0a; padding-top: 20px; }
        .footer-text strong { color: #ff1a1a; }
        .alert-custom { border-radius: 40px; padding: 12px 20px; font-size: 14px; margin-bottom: 16px; display: none; }
        .alert-custom.success { display: block; background: #0a1a0a; border: 1px solid #00ff44; color: #00ff44; }
        .alert-custom.error { display: block; background: #1a0a0a; border: 1px solid #ff1a1a; color: #ff4a4a; }
        .loading { display: none; text-align: center; color: #ffcc00; font-size: 14px; margin-top: 12px; }
        .loading i { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .label-custom { color: #aa6a6a; font-weight: 500; font-size: 14px; margin-bottom: 6px; display: block; }
        .mb-3 { margin-bottom: 18px; }
        .api-settings { background: #0a0505; border-radius: 16px; padding: 14px; margin-bottom: 16px; border: 1px solid #1a0a0a; }
        .api-settings label { color: #6a4a4a; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .api-settings input { background: #0a0505; border: 1px solid #2a1a1a; border-radius: 30px; padding: 8px 14px; color: #ff8a8a; font-size: 13px; width: 100%; margin-top: 4px; }
        .api-settings input:focus { border-color: #ff1a1a; outline: none; }
    </style>
</head>
<body>

    <div class="card-panel">
        <div class="logo">
            <i class="bi bi-server"></i>
            <h2>CREATE <span>PANEL</span></h2>
            <p>Pterodactyl Account Creator</p>
        </div>

        <div class="api-settings">
            <label><i class="bi bi-link"></i> Panel URL</label>
            <input type="text" id="panelUrl" placeholder="https://panel.domainkamu.com" value="https://panel.domainkamu.com">
            <label style="margin-top:10px;"><i class="bi bi-key"></i> API Key (Admin)</label>
            <input type="password" id="apiKey" placeholder="ptlc_xxxxxxxxxxxxx">
        </div>

        <div class="alert-custom" id="alertMessage"></div>

        <form id="createForm">
            <div class="mb-3">
                <label class="label-custom"><i class="bi bi-person"></i> Username</label>
                <input type="text" id="username" class="form-control-custom" placeholder="Masukkan username" required>
            </div>
            <div class="mb-3">
                <label class="label-custom"><i class="bi bi-lock"></i> Password</label>
                <input type="password" id="password" class="form-control-custom" placeholder="Masukkan password" required>
            </div>
            <div class="mb-3">
                <label class="label-custom"><i class="bi bi-envelope"></i> Email</label>
                <input type="email" id="email" class="form-control-custom" placeholder="email@example.com" required>
            </div>
            <button type="submit" class="btn-create" id="createBtn">
                <i class="bi bi-plus-circle"></i> CREATE
            </button>
        </form>

        <div class="loading" id="loadingIndicator">
            <i class="bi bi-arrow-repeat"></i> Creating account...
        </div>

        <div class="footer-text">
            &copy; 2026 <strong>Create By Samil</strong>
        </div>
    </div>

    <script>
        // ============================================================
        // PTERODACTYL CREATE ACCOUNT - READY PAKAI DOMAIN SENDIRI
        // ============================================================

        const form = document.getElementById('createForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const emailInput = document.getElementById('email');
        const panelUrl = document.getElementById('panelUrl');
        const apiKey = document.getElementById('apiKey');
        const alertMsg = document.getElementById('alertMessage');
        const loading = document.getElementById('loadingIndicator');
        const createBtn = document.getElementById('createBtn');

        // ===== LOAD SETTING DARI LOCAL STORAGE =====
        if (localStorage.getItem('panel_url')) {
            panelUrl.value = localStorage.getItem('panel_url');
        }
        if (localStorage.getItem('panel_api_key')) {
            apiKey.value = localStorage.getItem('panel_api_key');
        }

        panelUrl.addEventListener('change', function() {
            localStorage.setItem('panel_url', this.value);
        });
        apiKey.addEventListener('change', function() {
            localStorage.setItem('panel_api_key', this.value);
        });

        // ===== SUBMIT FORM =====
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const email = emailInput.value.trim();
            const url = panelUrl.value.trim().replace(/\/$/, '');
            const key = apiKey.value.trim();

            // Validasi
            if (!username || username.length < 3) {
                showAlert('Username minimal 3 karakter.', 'error');
                return;
            }
            if (!password || password.length < 6) {
                showAlert('Password minimal 6 karakter.', 'error');
                return;
            }
            if (!email || !email.includes('@')) {
                showAlert('Email tidak valid.', 'error');
                return;
            }
            if (!url || !url.startsWith('https://')) {
                showAlert('Panel URL harus HTTPS.', 'error');
                return;
            }
            if (!key || !key.startsWith('ptlc_')) {
                showAlert('API Key tidak valid. Harus dimulai dengan ptlc_', 'error');
                return;
            }

            // Loading
            loading.style.display = 'block';
            createBtn.disabled = true;
            createBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i> PROCESSING...';
            hideAlert();

            try {
                const response = await fetch(`${url}/api/application/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        email: email,
                        first_name: username,
                        last_name: 'User'
                    })
                });

                const data = await response.json();

                loading.style.display = 'none';
                createBtn.disabled = false;
                createBtn.innerHTML = '<i class="bi bi-plus-circle"></i> CREATE';

                if (response.ok && data.attributes) {
                    showAlert(`✅ Akun "${username}" berhasil dibuat! ID: ${data.attributes.id}`, 'success');
                    usernameInput.value = '';
                    passwordInput.value = '';
                    emailInput.value = '';
                } else {
                    const errors = data.errors?.map(e => e.detail).join(', ') || 'Gagal membuat akun.';
                    showAlert(`❌ ${errors}`, 'error');
                }
            } catch (error) {
                loading.style.display = 'none';
                createBtn.disabled = false;
                createBtn.innerHTML = '<i class="bi bi-plus-circle"></i> CREATE';
                showAlert(`❌ Error: ${error.message} — Pastikan panel URL benar dan API key valid.`, 'error');
            }
        });

        // ===== FUNGSI ALERT =====
        function showAlert(message, type) {
            alertMsg.className = 'alert-custom ' + type;
            alertMsg.innerHTML = message;
            alertMsg.style.display = 'block';
        }

        function hideAlert() {
            alertMsg.style.display = 'none';
        }

        usernameInput.addEventListener('input', hideAlert);
        passwordInput.addEventListener('input', hideAlert);
        emailInput.addEventListener('input', hideAlert);
    </script>

</body>
  </html>
